name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint - Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/
  
  typecheck-frontend:
    name: Type check - TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  build-frontend:
    name: Build — React (Vite)
    runs-on: ubuntu-latest
    needs: typecheck-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web  

  syntax-check-backend:
    name: Syntax check — Python
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi pydantic python-dotenv
      - name: Parse all backend files
        working-directory: backend
        run: |
          python - <<'EOF'
          import ast
          for f in ["main.py", "db.py", "embeddings.py", "agent_search.py", "agent.py"]:
              with open(f) as fh:
                  ast.parse(fh.read())
              print(f"  ✓ {f}")
          print("All files parse OK")
          EOF
  deploy:
    name: Deploy - AWS EC2
    runs-on: ubuntu-latest
    needs: [lint-backend, typecheck-frontend, build-frontend, syntax-check-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd mail-sherlock
            git pull origin main
            docker build -t mail-sherlock .
            docker stop mail-sherlock || true
            docker rm mail-sherlock || true
            docker run -d \
              --name mail-sherlock \
              --restart unless-stopped \
              --env-file backend/.env \
              -p 8000:8000 \
              mail-sherlock