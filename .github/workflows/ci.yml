name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/

  health-check:
    name: Smoke test (import + schema)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi pydantic python-dotenv

      - name: Check FastAPI app loads
        working-directory: backend
        run: |
          python - <<'EOF'
          import ast, sys
          for f in ["main.py", "db.py", "embeddings.py", "agent_search.py"]:
              with open(f) as fh:
                  ast.parse(fh.read())
              print(f"  ✓ {f}")
          print("All files parse OK")
          EOF
