services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mail_sherlock_mongo:/data/db
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: backend/.env
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mail_sherlock_mongo:
