server {
    listen 80;
    server_name _;

    # Long timeout for Gemini API calls + streaming responses
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    120s;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for SSE (server-sent events): disable buffering so
        # each chunk is forwarded to the browser immediately instead of
        # being held until the full response is ready.
        proxy_buffering    off;
        proxy_cache        off;

        # Keep the upstream connection alive across the stream lifetime.
        proxy_set_header   Connection     "";
        proxy_set_header   Host           $host;
        proxy_set_header   X-Real-IP      $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
